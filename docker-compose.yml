# SLY — CRM — production compose for the Hostinger VPS.
# Mirrors the working af-crm / reactivation-crm pattern: no explicit network
# (host-mode Traefik discovers the container on its default bridge),
# `expose` + Traefik labels, TLS via the "letsencrypt" resolver.
#
# Basic-auth is a dedicated credential for SLY, separate from af-crm / reactivation-crm
# (username: luc.gerbet — dot instead of a space, since Traefik's basicauth users list
# is comma/colon-delimited and a literal space in the username is best avoided).

services:
  sly-crm:
    build:
      context: .
    container_name: sly-crm
    restart: unless-stopped
    expose:
      - "3003"
    labels:
      - traefik.enable=true
      # Public router — no Basic Auth — for callers that aren't a human browser
      # session: the unsubscribe link, Stripe/Calendly webhooks, and sly-shop's
      # server-to-server order intake/finalize/booking calls. Rule specificity
      # gives this router higher priority than the catch-all router below, so
      # only these path prefixes skip auth; everything else stays protected.
      # NOTE: Traefik only strips Basic Auth here — it is NOT the real security
      # boundary for the new routes. /api/webhooks/stripe verifies Stripe's
      # signature; /api/orders/*, /api/appointments/from-widget,
      # /api/leads/capture, and /api/analytics/track check a bearer
      # SLY_INTAKE_SECRET — all inside Express (see lib/orderHelpers.js and
      # lib/stripe.js). /api/analytics/summary is deliberately NOT listed
      # here — it stays behind Basic Auth like the rest of the human-facing CRM.
      # `/api/clients/set-` covers set-address / set-measurements / set-profile
      # in one prefix: listing them individually already silently broke
      # set-measurements once (added to Express but not here, so every call
      # 401'd at the edge and measurements never reached the CRM). Every
      # `set-*` client route is secret-gated in Express and narrow by design,
      # so the shared prefix is safe and stops that failure recurring.
      # `/survey` is the one page a CLIENT ever opens (satisfaction form sent
      # with the payment confirmation). It has to skip Basic Auth — a client
      # has no account — and is guarded instead by the unguessable per-order
      # token in the URL, checked in routes/survey.js.
      # `/api/gift-cards` added 2026-08-30 for "The SLY Experience" gift
      # offer — sly-shop calls intake/:code/:code/redeem server-to-server,
      # each individually secret-gated in Express like the others above.
      # `/api/content/intake`, `/next-topic` and `/topics/bulk` added
      # 2026-09-08 for the Instagram carousel routine: the scheduled task runs
      # on Luc's Mac, has no browser session, and is secret-gated in Express
      # (requireIntakeSecret). Only those three paths are listed — the rest of
      # /api/content (editing, uploads, images) stays behind Basic Auth.
      - "traefik.http.routers.slycrm-public.rule=Host(`sly-crm.srv1758374.hstgr.cloud`) && (PathPrefix(`/survey`) || PathPrefix(`/workshop`) || PathPrefix(`/api/unsubscribe`) || PathPrefix(`/api/webhooks`) || PathPrefix(`/api/orders/intake`) || PathPrefix(`/api/orders/finalize`) || PathPrefix(`/api/orders/search`) || PathPrefix(`/api/orders/upcoming-meetings`) || PathPrefix(`/api/orders/send-to-workshop`) || PathPrefix(`/api/orders/feedback`) || PathPrefix(`/api/clients/set-`) || PathPrefix(`/api/clients/lookup`) || PathPrefix(`/api/sizes/lookup`) || PathPrefix(`/api/appointments/from-widget`) || PathPrefix(`/api/leads/capture`) || PathPrefix(`/api/analytics/track`) || PathPrefix(`/api/gift-cards`) || PathPrefix(`/api/content/intake`) || PathPrefix(`/api/content/next-topic`) || PathPrefix(`/api/content/topics/bulk`))"
      - traefik.http.routers.slycrm-public.entrypoints=websecure
      - traefik.http.routers.slycrm-public.tls.certresolver=letsencrypt
      - traefik.http.routers.slycrm-public.service=slycrm-public
      - traefik.http.services.slycrm-public.loadbalancer.server.port=3003
      - "traefik.http.routers.slycrm.rule=Host(`sly-crm.srv1758374.hstgr.cloud`)"
      - traefik.http.routers.slycrm.entrypoints=websecure
      - traefik.http.routers.slycrm.tls.certresolver=letsencrypt
      - traefik.http.routers.slycrm.service=slycrm
      - traefik.http.services.slycrm.loadbalancer.server.port=3003
      - traefik.http.routers.slycrm.middlewares=slycrm-auth
      - "traefik.http.middlewares.slycrm-auth.basicauth.users=luc.gerbet:$$apr1$$PrYu.99m$$dbmY8YN92V/3EKq7HDGkS."
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/sly_crm.db
      - PORT=3003
      - TZ=Europe/Paris
      - PUBLIC_URL=https://sly-crm.srv1758374.hstgr.cloud
    volumes:
      - sly_crm_data:/data

volumes:
  sly_crm_data:
