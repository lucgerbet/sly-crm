# SLY — CRM — production compose for the Hostinger VPS.
# Mirrors the working af-crm / reactivation-crm pattern: no explicit network
# (host-mode Traefik discovers the container on its default bridge),
# `expose` + Traefik labels, TLS via the "letsencrypt" resolver.
#
# Basic-auth is a dedicated credential for SLY, separate from af-crm / reactivation-crm
# (username: luc.gerbet — dot instead of a space, since Traefik's basicauth users list
# is comma/colon-delimited and a literal space in the username is best avoided).

services:
  sly-crm:
    build:
      context: .
    container_name: sly-crm
    restart: unless-stopped
    expose:
      - "3003"
    labels:
      - traefik.enable=true
      # Public router — no Basic Auth — for the email unsubscribe link only.
      # Rule length gives it higher priority than the catch-all router below,
      # so only /api/unsubscribe/* skips auth; everything else stays protected.
      - "traefik.http.routers.slycrm-public.rule=Host(`sly-crm.srv1758374.hstgr.cloud`) && PathPrefix(`/api/unsubscribe`)"
      - traefik.http.routers.slycrm-public.entrypoints=websecure
      - traefik.http.routers.slycrm-public.tls.certresolver=letsencrypt
      - traefik.http.services.slycrm-public.loadbalancer.server.port=3003
      - "traefik.http.routers.slycrm.rule=Host(`sly-crm.srv1758374.hstgr.cloud`)"
      - traefik.http.routers.slycrm.entrypoints=websecure
      - traefik.http.routers.slycrm.tls.certresolver=letsencrypt
      - traefik.http.services.slycrm.loadbalancer.server.port=3003
      - traefik.http.routers.slycrm.middlewares=slycrm-auth
      - "traefik.http.middlewares.slycrm-auth.basicauth.users=luc.gerbet:$$apr1$$PrYu.99m$$dbmY8YN92V/3EKq7HDGkS."
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/sly_crm.db
      - PORT=3003
      - TZ=Europe/Paris
      - PUBLIC_URL=https://sly-crm.srv1758374.hstgr.cloud
    volumes:
      - sly_crm_data:/data

volumes:
  sly_crm_data:
